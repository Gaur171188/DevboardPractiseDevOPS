apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: devboard-fe
  namespace: devboard-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devboard-fe
  template:
    metadata:
      labels:
        app: devboard-fe
    spec:
      containers:
      - name: devboard-frontend
        image: gauravph17/devboard-frontend:latest
        ports:
        - containerPort: 4173
        resources:
         requests:
           cpu: 10m
           memory: 64Mi

         limits:
            cpu: 250m
            memory: 128Mi

