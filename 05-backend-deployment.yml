apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: devboard-be
  namespace: devboard-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devboard-be
  template:
    metadata:
      labels:
        app: devboard-be
    spec:
      containers:
        - name: devboard-backend
          image: trainwithshubham/devboard-backend:latest
       
       
          ports:
            - containerPort: 8080

          env: 
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: devboard-configmap
                  key: PORT

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRESS_PASSWORD

            - name: POSTGRESS_USER
              valueFrom:
                 configMapKeyRef:
                   name: devboard-configmap
                   key: POSTGRESS_USER

            - name: POSTGRESS_DB
              valueFrom:
                 configMapKeyRef:
                   name: devboard-configmap
                   key: POSTGRESS_DB

            - name: POSTGRES_URL
              value: postgres://$(POSTGRESS_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRESS_DB)?sslmode=disable

      resources:
         requests:
           cpu: 10m
           memory: 64Mi

         limits:
            cpu: 250m
            memory: 128Mi

