apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ .Values.namespace }}

spec:
  selector:
    app: devboard-fe

  ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }} #service port
      targetPort: {{ .Values.frontend.targetPort }} #container Port
      nodePort: {{ .Values.frontend.nodePort }}

  #type: If the type of service is not given it's called cluser ip

  type: NodePort
